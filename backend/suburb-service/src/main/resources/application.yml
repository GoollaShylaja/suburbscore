server:
  port: 8082

spring:
  application:
    name: suburb-service

  datasource:
    url: jdbc:postgresql://localhost:5433/suburbscore_suburbs
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: redis

  jackson:
    serialization:
      write-dates-as-timestamps: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

eureka:
  client:
    enabled: false
    service-url:
      defaultZone: http://localhost:8761/eureka/
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}

app:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

postcodeapi:
  base-url: http://v0.postcodeapi.com.au
  min-postcode: 2000
  max-postcode: 2770

nsw:
  schools:
    api:
      url: https://data.nsw.gov.au/data/api/3/action/datastore_search
      resource-id: 3e6d5f6a-055c-440d-a690-fc0537c31095
      page-size: 1000

external:
  api:
    connect-timeout: 10000   # 10s connect timeout for slow government APIs
    read-timeout: 30000      # 30s read timeout for bulk data fetches

transport:
  nsw:
    base-url: https://api.transport.nsw.gov.au
    api-key: ${TRANSPORT_NSW_API_KEY:}

  # Manually-verified peak-hour door-to-door commute times (walk + wait + transit).
  # Applied on every startup to fix suburbs where the TfNSW Trip API consistently
  # returns all-stations or off-peak service times instead of the peak express.
  corrections:
    # Western Line — T1 express is 63-65 min ride; API returned all-stations 107 mins
    - suburb: Penrith
      cbdCommuteMinsTrain: 75
    # South Coast Line — T4 is 80-85 min; API returned 108 mins
    - suburb: Wollongong
      cbdCommuteMinsTrain: 92
    # Blue Mountains Line — 107 min all-stations / 102 min limited-stops (timetable verified)
    - suburb: Katoomba
      cbdCommuteMinsTrain: 107
    # Central West NSW TrainLink — ~195 min ride; API returned 254 mins
    - suburb: Bathurst
      cbdCommuteMinsTrain: 202
    # Blue Mountains corridor — all consistently 30-50 mins over express times
    - suburb: Wentworth Falls
      cbdCommuteMinsTrain: 115
    - suburb: Hazelbrook
      cbdCommuteMinsTrain: 105
    - suburb: Woodford
      cbdCommuteMinsTrain: 110
    # T1 Richmond Line — 75 min express; API returned 93-95 mins
    - suburb: Richmond
      cbdCommuteMinsTrain: 82
    # Albury — NSW TrainLink XPT 2×/day (~7h45m), not a commuter service.
    # Station name added so users know a station exists; commute stays NULL.
    - suburb: Albury
      nearestStation: Albury Station

    # Trip API routed via bus/light rail from suburb centroid instead of nearby train.
    # Station and walk time are correct; commute time is supplied manually.
    # T4 Eastern Suburbs Railway: Edgecliff → Town Hall ~12 min
    - suburb: Paddington
      postcode: "2021"
      cbdCommuteMinsTrain: 23
    # T4: Bondi Junction → Town Hall ~19 min
    - suburb: Woollahra
      postcode: "2025"
      cbdCommuteMinsTrain: 27
    # T4: Kings Cross → Town Hall ~10 min
    - suburb: Woolloomooloo
      postcode: "2011"
      cbdCommuteMinsTrain: 15
    # T1 North Shore: Artarmon → Central ~22 min
    - suburb: Willoughby
      postcode: "2068"
      cbdCommuteMinsTrain: 39
    # T2 Airport/South: Macquarie Fields → Central ~40 min
    - suburb: Macquarie Links
      postcode: "2565"
      cbdCommuteMinsTrain: 48

    # Ferry false positives — geospatial match hit a river wharf, not a ferry service.
    # Note: Glebe (F10 Blackwattle Bay) is intentionally excluded — service is real.
    - suburb: Aldavilla
      hasFerryAccess: false
    - suburb: Millers Forest
      hasFerryAccess: false

osm:
  overpass:
    url: https://overpass-api.de/api/interpreter

data:
  dir: ${DATA_DIR:./data}
  bocsar:
    file: ${BOCSAR_FILE:SuburbData25Q4.csv}

kafka:
  topic:
    suburb-data-updated: suburb-data-updated

logging:
  level:
    com.suburbscore.suburb: INFO

---
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: jdbc:postgresql://postgres:5432/suburbscore_suburbs

  jpa:
    hibernate:
      ddl-auto: validate

  data:
    redis:
      host: redis

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
